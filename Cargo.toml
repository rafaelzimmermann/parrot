[package]
name = "hypr-speak"
version = "0.1.0"
edition = "2021"
description = "Speak Selection overlay for Hyprland/Wayland: hotkey → read selection → speak → auto-close"
license = "MIT"
repository = "https://example.invalid/parrot"

[lib]
name = "hypr_speak"
path = "src/lib.rs"

[[bin]]
name = "hypr-speak"
path = "src/main.rs"

[dependencies]
eframe = "0.35"
egui = "0.35"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
wl-clipboard-rs = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Lean single-binary release build.
# rodio is built without default features (no symphonia decoders): we feed raw
# PCM SamplesBuffers produced by the in-process TTS engine.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
